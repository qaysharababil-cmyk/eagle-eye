<!-- public/parent.html -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Parent Lookup (Demo)</title>
  <style>
    body{font-family:Arial;padding:18px;background:#f7fafc}
    .card{max-width:720px;margin:0 auto;background:#fff;padding:18px;border-radius:10px}
    label{display:block;margin-top:8px;font-weight:600}
    input,button{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #dcdcdc}
    button{background:#16a34a;color:#fff;border:none;font-weight:700;cursor:pointer}
    #map{height:360px;margin-top:12px;border-radius:8px;border:1px solid #e6eef6}
    pre{background:#f8fafc;padding:8px;border-radius:8px;white-space:pre-wrap;word-wrap:break-word}
  </style>
</head>
<body>
  <div class="card">
    <h2>Parent Lookup (Demo)</h2>
    <p style="color:#555;margin-top:0">This demo uses a system password (prefilled). Use only with explicit consent.</p>

    <label for="password">System password</label>
    <input id="password" type="password" value="300309" />

    <label for="phone">Child phone (exact, used during pairing)</label>
    <input id="phone" placeholder="+1234567890" />

    <button id="btn">Lookup last-known location</button>

    <div id="out" style="display:none;margin-top:14px">
      <h3>Result</h3>
      <pre id="json"></pre>
      <p><strong>Lat:</strong> <span id="lat">-</span> &nbsp; <strong>Lon:</strong> <span id="lon">-</span></p>
      <iframe id="map" src="https://www.google.com/maps?q=0,0&z=2&output=embed" style="width:100%;height:360px;border:0;border-radius:8px;margin-top:12px"></iframe>
      <p style="margin-top:8px"><a id="mapsLink" href="#" target="_blank">Open in Google Maps</a></p>
    </div>
  </div>

  <script>
    document.getElementById('btn').addEventListener('click', async () => {
      const pw = document.getElementById('password').value.trim();
      const phone = document.getElementById('phone').value.trim();
      if (!pw || !phone) return alert('Enter password and phone');

      try {
        const url = '/api/get-location?phone=' + encodeURIComponent(phone);
        const resp = await fetch(url, { headers: { 'Authorization': 'Bearer ' + pw } });
        const data = await resp.json().catch(() => null);
        if (!resp.ok) {
          alert('Lookup failed: ' + (data?.error || resp.status));
          return;
        }

        document.getElementById('json').textContent = JSON.stringify(data, null, 2);
        const lat = data.location.lat;
        const lon = data.location.lon;
        document.getElementById('lat').textContent = lat;
        document.getElementById('lon').textContent = lon;
        document.getElementById('map').src = `https://www.google.com/maps?q=${lat},${lon}&z=16&output=embed`;
        document.getElementById('mapsLink').href = `https://www.google.com/maps?q=${lat},${lon}`;
        document.getElementById('out').style.display = 'block';
      } catch (err) {
        alert('Network or server error: ' + (err.message || err));
      }
    });
  </script>
</body>
</html>
